name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: forgeml
          POSTGRES_PASSWORD: forgeml
          POSTGRES_DB: forgeml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U forgeml"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Lint backend
        run: ruff check backend/src backend/tests scripts/ci scripts/dev scripts/examples scripts/ops scripts/workers pipelines/airflow/dags ml/libraries ml/examples
      - name: Run example training smoke
        run: PYTHONPATH=. python scripts/examples/run_local_training.py --output-dir /tmp/forgeml-example-artifacts
      - name: Test backend
        env:
          FORGEML_DATABASE_URL: postgresql+psycopg://forgeml:forgeml@localhost:5432/forgeml_test
        run: pytest backend/tests
      - name: Check Alembic migration contract
        run: python scripts/ci/check_alembic_migration_contract.py
      - name: Check SQLAlchemy schema contract
        run: python scripts/ci/check_sqlalchemy_schema_contract.py
      - name: Check artifact manifest contract
        run: python scripts/ci/check_artifact_manifest_contract.py
      - name: Check MLflow tracking contract
        run: python scripts/ci/check_mlflow_tracking_contract.py
      - name: Check Airflow orchestration contract
        run: python scripts/ci/check_airflow_orchestration_contract.py
      - name: Check deployment runtime contract
        run: python scripts/ci/check_deployment_runtime_contract.py
      - name: Check OpenAPI contract
        run: python scripts/ci/generate_openapi_contract.py --check
      - name: Check problem details contract
        run: python scripts/ci/check_problem_details_contract.py
      - name: Check API authorization contract
        run: python scripts/ci/check_api_authorization_contract.py
      - name: Check permission catalog
        run: python scripts/ci/check_permission_catalog.py
      - name: Check runtime config policy
        run: python scripts/ci/check_runtime_config_policy.py
      - name: Check request logging contract
        run: python scripts/ci/check_request_logging_contract.py
      - name: Check release smoke contract
        run: python scripts/ci/check_release_smoke_contract.py
      - name: Check release manifest contract
        run: python scripts/ci/check_release_manifest_contract.py
      - name: Check release evidence workflow
        run: python scripts/ci/check_release_evidence_workflow.py
      - name: Check release manifest verifier contract
        run: python scripts/ci/check_release_manifest_verifier_contract.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend
        run: npm --prefix frontend ci
      - name: Audit frontend production dependencies
        run: npm --prefix frontend audit --omit=dev
      - name: Lint frontend
        run: npm --prefix frontend run lint
      - name: Test frontend
        run: npm --prefix frontend run test -- --run
      - name: Install Playwright browsers
        run: npm --prefix frontend exec playwright install --with-deps chromium
      - name: Test frontend e2e
        run: npm --prefix frontend run e2e
      - name: Build frontend
        run: npm --prefix frontend run build
      - name: Enforce frontend bundle budget
        run: python scripts/ci/check_frontend_bundle_budget.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f infra/docker/backend.Dockerfile .
      - name: Build frontend image
        run: docker build -f infra/docker/frontend.Dockerfile .

  production-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e .
      - name: Run production-readiness checks
        run: python scripts/ci/production_readiness.py
      - name: Validate full compose profile
        run: docker compose -f infra/compose/docker-compose.yml --profile full config

  release-evidence:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker, production-readiness]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build release manifest
        run: >
          python scripts/ops/build_release_manifest.py
          --output dist/release/forgeml-release-manifest.json
          --git-sha "$GITHUB_SHA"
          --git-branch "$GITHUB_REF_NAME"
          --ci-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
      - name: Verify release manifest
        run: >
          python scripts/ops/verify_release_manifest.py
          --manifest dist/release/forgeml-release-manifest.json
          --require-ci-evidence
      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: forgeml-release-manifest
          path: dist/release/forgeml-release-manifest.json
          if-no-files-found: error
